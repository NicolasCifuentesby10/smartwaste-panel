<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartwaste - Acceso al Sistema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <img src="img/logo.png" alt="Smartwaste Logo" class="logo">
        <p class="slogan">Pequeñas acciones, grandes cambios</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="admin@conjunto.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="role">Rol de Usuario</label>
                <select id="role">
                    <option value="admin">Administrador de Copropiedad</option>
                    <option value="reciclador">Reciclador de Oficio</option>
                </select>
            </div>

            <button type="submit" class="btn-primary">Ingresar al Panel</button>
        </form>
    </div>

    <script src="auth.js"></script>
</body>
</html>
